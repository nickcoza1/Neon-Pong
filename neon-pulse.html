<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON//PULSE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030308;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    user-select: none;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.hidden {
    display: none !important;
}

.overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at center,
            rgba(130, 0, 255, 0.08),
            transparent 45%
        ),
        rgba(2, 2, 8, 0.76);
    backdrop-filter: blur(12px);
}

.panel {
    position: relative;
    width: min(550px, 90vw);
    padding: 52px 42px;
    text-align: center;
    background:
        linear-gradient(
            145deg,
            rgba(12, 13, 27, 0.96),
            rgba(5, 6, 14, 0.96)
        );
    border: 1px solid rgba(150, 40, 255, 0.35);
    box-shadow:
        0 0 80px rgba(100, 0, 255, 0.12),
        inset 0 0 60px rgba(100, 0, 255, 0.025);
}

.panel::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 45px;
    height: 45px;
    border-left: 2px solid #9d35ff;
    border-top: 2px solid #9d35ff;
    box-shadow:
        -5px -5px 20px rgba(157, 53, 255, 0.25);
}

.panel::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    width: 45px;
    height: 45px;
    border-right: 2px solid #9d35ff;
    border-bottom: 2px solid #9d35ff;
    box-shadow:
        5px 5px 20px rgba(157, 53, 255, 0.25);
}

.small-title {
    color: #707080;
    font-size: 10px;
    letter-spacing: 5px;
    margin-bottom: 16px;
}

h1 {
    font-size: clamp(42px, 8vw, 78px);
    font-weight: 900;
    letter-spacing: 5px;
    line-height: 1;
    color: white;
    text-shadow:
        0 0 10px rgba(0, 220, 255, 0.9),
        0 0 35px rgba(0, 220, 255, 0.35);
}

h1 span {
    color: #9d35ff;
    text-shadow:
        0 0 10px #9d35ff,
        0 0 30px rgba(157, 53, 255, 0.5);
}

.subtitle {
    margin-top: 15px;
    color: #5b6070;
    font-size: 10px;
    letter-spacing: 5px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 42px;
}

button {
    width: 100%;
    padding: 17px 20px;
    color: white;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 3px;
    cursor: pointer;
    transition:
        transform 0.15s ease,
        background 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
}

button:hover {
    transform: translateY(-2px);
    background: rgba(157, 53, 255, 0.08);
    border-color: rgba(157, 53, 255, 0.7);
    box-shadow:
        0 0 30px rgba(157, 53, 255, 0.15);
}

button.primary {
    border-color: rgba(0, 220, 255, 0.5);
    background:
        linear-gradient(
            90deg,
            rgba(0, 220, 255, 0.08),
            rgba(157, 53, 255, 0.08)
        );
}

.controls {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 30px;
    color: #505666;
    font-size: 9px;
    letter-spacing: 2px;
}

#hud {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
}

#hud.active {
    opacity: 1;
}

.score {
    position: absolute;
    top: 5.5%;
    font-size: clamp(55px, 8vw, 95px);
    font-weight: 900;
    line-height: 1;
}

#playerScore {
    left: 20%;
    color: #00e5ff;
    text-shadow:
        0 0 12px #00e5ff,
        0 0 35px rgba(0, 229, 255, 0.65);
}

#enemyScore {
    right: 20%;
    color: #ff2020;
    text-shadow:
        0 0 12px #ff2020,
        0 0 35px rgba(255, 32, 32, 0.65);
}

.scoreLabel {
    position: absolute;
    top: 17%;
    font-size: 8px;
    letter-spacing: 4px;
    opacity: 0.42;
}

#playerLabel {
    left: 20%;
    color: #00e5ff;
}

#enemyLabel {
    right: 20%;
    color: #ff2020;
}

#scoreLimit {
    position: absolute;
    left: 50%;
    top: 10%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-size: 8px;
    letter-spacing: 4px;
}

#rally {
    position: absolute;
    left: 50%;
    bottom: 5%;
    transform: translateX(-50%);
    text-align: center;
    color: rgba(255,255,255,0.3);
    font-size: 8px;
    letter-spacing: 4px;
}

#rallyNumber {
    margin-top: 6px;
    color: white;
    font-size: 20px;
    letter-spacing: 1px;
    text-shadow:
        0 0 15px white;
}

#pauseHint {
    position: absolute;
    right: 22px;
    bottom: 20px;
    color: rgba(255,255,255,0.2);
    font-size: 8px;
    letter-spacing: 2px;
}

#countdown {
    position: fixed;
    inset: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
}

#countdown.active {
    opacity: 1;
}

#countdownText {
    color: white;
    font-size: clamp(75px, 15vw, 160px);
    font-weight: 900;
    text-shadow:
        0 0 15px #9d35ff,
        0 0 70px rgba(157, 53, 255, 0.65);
}

.overlayTitle {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 5px;
}

.overlaySubtitle {
    margin-top: 12px;
    margin-bottom: 32px;
    color: #596070;
    font-size: 10px;
    letter-spacing: 3px;
}

.overlayButtons {
    display: flex;
    gap: 10px;
}

.overlayButtons button {
    flex: 1;
}

body.ai-mode canvas {
    cursor: none;
}

@media (max-width: 600px) {
    .panel {
        padding: 42px 25px;
    }

    #playerScore {
        left: 12%;
    }

    #enemyScore {
        right: 12%;
    }

    #playerLabel {
        left: 12%;
    }

    #enemyLabel {
        right: 12%;
    }

    .controls {
        flex-direction: column;
        gap: 8px;
    }
}
</style>
</head>

<body>
<canvas id="gameCanvas"></canvas>

<div id="menu" class="overlay">
    <div class="panel">
        <div class="small-title">SYSTEM ONLINE // ARCADE 01</div>

        <h1>NEON<span>//</span>PULSE</h1>

        <div class="subtitle">THE FUTURE OF PONG</div>

        <div class="buttons">
            <button id="aiButton" class="primary">
                01 — PLAYER VS AI
            </button>

            <button id="twoPlayerButton">
                02 — TWO PLAYERS
            </button>
        </div>

        <div class="controls">
            <span>VS AI — MOUSE</span>
            <span>TWO PLAYER — W / S • ↑ / ↓</span>
        </div>
    </div>
</div>

<div id="hud">
    <div id="playerScore" class="score">0</div>
    <div id="enemyScore" class="score">0</div>

    <div id="playerLabel" class="scoreLabel">PLAYER 1</div>
    <div id="enemyLabel" class="scoreLabel">AI</div>

    <div id="scoreLimit">FIRST TO 7</div>

    <div id="rally">
        RALLY
        <div id="rallyNumber">0</div>
    </div>

    <div id="pauseHint">ESC — PAUSE</div>
</div>

<div id="countdown">
    <div id="countdownText">3</div>
</div>

<div id="pauseScreen" class="overlay hidden">
    <div class="panel">
        <div class="overlayTitle">PAUSED</div>
        <div class="overlaySubtitle">SYSTEM STANDBY</div>

        <div class="overlayButtons">
            <button id="resumeButton" class="primary">RESUME</button>
            <button id="quitButton">QUIT</button>
        </div>
    </div>
</div>

<div id="gameOver" class="overlay hidden">
    <div class="panel">
        <div id="gameOverTitle" class="overlayTitle">VICTORY</div>
        <div id="gameOverSubtitle" class="overlaySubtitle">
            PLAYER 1 WINS
        </div>

        <div class="overlayButtons">
            <button id="rematchButton" class="primary">REMATCH</button>
            <button id="menuButton">MENU</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let width = window.innerWidth;
let height = window.innerHeight;

const PLAYER_COLOR = "#00e5ff";
const ENEMY_COLOR = "#ff2020";
const BORDER_COLOR = "#9d35ff";
const WHITE = "#ffffff";

const WIN_SCORE = 7;
const ARENA_TOP = 0.16;
const ARENA_BOTTOM = 0.84;

let gameRunning = false;
let paused = false;
let gameMode = "ai";
let playerScore = 0;
let enemyScore = 0;
let rally = 0;
let countdownRunning = false;
let screenShake = 0;

const keys = {};

window.addEventListener("keydown", function(event) {
    keys[event.key] = true;

    if (event.key === "Escape") {
        event.preventDefault();

        if (gameRunning && !countdownRunning) {
            togglePause();
        }
    }
});

window.addEventListener("keyup", function(event) {
    keys[event.key] = false;
});

canvas.addEventListener("mousemove", function(event) {
    if (
        gameMode !== "ai" ||
        !gameRunning ||
        paused ||
        countdownRunning
    ) {
        return;
    }

    const rect = canvas.getBoundingClientRect();

    const mouseY =
        (event.clientY - rect.top) *
        (canvas.height / rect.height);

    player.y = mouseY - player.height / 2;

    player.y = clamp(
        player.y,
        arenaTop(),
        arenaBottom() - player.height
    );
});

const player = {
    x: 0,
    y: 0,
    width: 15,
    height: 130,
    speed: 10
};

const enemy = {
    x: 0,
    y: 0,
    width: 15,
    height: 130,
    speed: 7
};

const ball = {
    x: 0,
    y: 0,
    radius: 7,
    vx: 0,
    vy: 0,
    speed: 8
};

let particles = [];
let trail = [];

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width;
    canvas.height = height;

    positionObjects();
}

window.addEventListener("resize", resize);

function positionObjects() {
    player.x = width * 0.08;
    player.y = height / 2 - player.height / 2;

    enemy.x = width * 0.92 - enemy.width;
    enemy.y = height / 2 - enemy.height / 2;

    ball.x = width / 2;
    ball.y = height / 2;
}

function arenaTop() {
    return height * ARENA_TOP;
}

function arenaBottom() {
    return height * ARENA_BOTTOM;
}

function resetBall(direction) {
    ball.x = width / 2;
    ball.y = height / 2;
    ball.speed = 8;

    const angle = Math.random() * 0.8 - 0.4;

    ball.vx =
        Math.cos(angle) *
        ball.speed *
        direction;

    ball.vy = Math.sin(angle) * ball.speed;

    trail = [];
}

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function spawnParticles(x, y, color, amount) {
    for (let i = 0; i < amount; i++) {
        particles.push({
            x: x,
            y: y,
            vx: random(-5, 5),
            vy: random(-5, 5),
            life: 1,
            decay: random(0.025, 0.055),
            size: random(1, 4),
            color: color
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.96;
        p.vy *= 0.96;

        p.life -= p.decay;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.save();

        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

function drawBackground(time) {
    ctx.fillStyle = "#030308";
    ctx.fillRect(0, 0, width, height);

    const cyanGlow = ctx.createRadialGradient(
        width * 0.2,
        height * 0.5,
        0,
        width * 0.2,
        height * 0.5,
        width * 0.65
    );

    cyanGlow.addColorStop(0, "rgba(0,229,255,0.045)");
    cyanGlow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = cyanGlow;
    ctx.fillRect(0, 0, width, height);

    const redGlow = ctx.createRadialGradient(
        width * 0.8,
        height * 0.5,
        0,
        width * 0.8,
        height * 0.5,
        width * 0.65
    );

    redGlow.addColorStop(0, "rgba(255,32,32,0.04)");
    redGlow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = redGlow;
    ctx.fillRect(0, 0, width, height);

    const purpleGlow = ctx.createRadialGradient(
        width / 2,
        height / 2,
        0,
        width / 2,
        height / 2,
        width * 0.5
    );

    purpleGlow.addColorStop(0, "rgba(157,53,255,0.04)");
    purpleGlow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = purpleGlow;
    ctx.fillRect(0, 0, width, height);

    const gridSize = 60;
    const offset = (time * 0.02) % gridSize;

    ctx.lineWidth = 1;

    for (
        let x = -gridSize + offset;
        x < width + gridSize;
        x += gridSize
    ) {
        ctx.strokeStyle = "rgba(157,53,255,0.045)";

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
    }

    for (
        let y = -gridSize + offset;
        y < height + gridSize;
        y += gridSize
    ) {
        ctx.strokeStyle = "rgba(157,53,255,0.045)";

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
    }

    drawArena();
}

function drawArena() {
    const left = width * 0.06;
    const right = width * 0.94;
    const top = arenaTop();
    const bottom = arenaBottom();

    ctx.save();

    ctx.shadowColor = BORDER_COLOR;
    ctx.shadowBlur = 25;
    ctx.strokeStyle = "rgba(157,53,255,0.8)";
    ctx.lineWidth = 2;

    ctx.strokeRect(
        left,
        top,
        right - left,
        bottom - top
    );

    ctx.restore();

    ctx.strokeStyle = "rgba(190,110,255,0.35)";
    ctx.lineWidth = 1;

    ctx.strokeRect(
        left + 5,
        top + 5,
        right - left - 10,
        bottom - top - 10
    );

    const cornerSize = 30;

    ctx.save();

    ctx.strokeStyle = "#b86aff";
    ctx.shadowColor = "#9d35ff";
    ctx.shadowBlur = 15;
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(left, top + cornerSize);
    ctx.lineTo(left, top);
    ctx.lineTo(left + cornerSize, top);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(right - cornerSize, top);
    ctx.lineTo(right, top);
    ctx.lineTo(right, top + cornerSize);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(left, bottom - cornerSize);
    ctx.lineTo(left, bottom);
    ctx.lineTo(left + cornerSize, bottom);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(right - cornerSize, bottom);
    ctx.lineTo(right, bottom);
    ctx.lineTo(right, bottom - cornerSize);
    ctx.stroke();

    ctx.restore();

    ctx.save();

    ctx.setLineDash([8, 14]);
    ctx.strokeStyle = "rgba(157,53,255,0.55)";
    ctx.shadowColor = "#9d35ff";
    ctx.shadowBlur = 12;
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.moveTo(width / 2, top + 10);
    ctx.lineTo(width / 2, bottom - 10);
    ctx.stroke();

    ctx.restore();
}

function drawPaddle(paddle, color) {
    ctx.save();

    ctx.shadowColor = color;
    ctx.shadowBlur = 30;
    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.roundRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height,
        7
    );
    ctx.fill();

    ctx.shadowBlur = 10;
    ctx.fillStyle = "rgba(255,255,255,0.82)";

    ctx.fillRect(
        paddle.x + 3,
        paddle.y + 10,
        3,
        paddle.height - 20
    );

    ctx.restore();
}

function drawBall() {
    for (let i = 0; i < trail.length; i++) {
        const p = trail[i];
        const alpha = (i / trail.length) * 0.3;

        ctx.save();

        ctx.globalAlpha = alpha;
        ctx.fillStyle = WHITE;
        ctx.shadowColor = BORDER_COLOR;
        ctx.shadowBlur = 20;

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            2 + (i / trail.length) * 3,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.restore();
    }

    ctx.save();

    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 35;
    ctx.fillStyle = "#ffffff";

    ctx.beginPath();
    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.restore();
}

function paddleCollision(paddle) {
    return (
        ball.x - ball.radius < paddle.x + paddle.width &&
        ball.x + ball.radius > paddle.x &&
        ball.y > paddle.y &&
        ball.y < paddle.y + paddle.height
    );
}

function updatePlayer() {
    if (gameMode === "ai") {
        return;
    }

    if (keys["w"] || keys["W"]) {
        player.y -= player.speed;
    }

    if (keys["s"] || keys["S"]) {
        player.y += player.speed;
    }

    player.y = clamp(
        player.y,
        arenaTop(),
        arenaBottom() - player.height
    );
}

function updateEnemy() {
    if (gameMode === "ai") {
        const target = ball.y - enemy.height / 2;

        enemy.y += (target - enemy.y) * 0.075;
        enemy.y += Math.sin(performance.now() * 0.002) * 0.15;
    } else {
        if (keys["ArrowUp"]) {
            enemy.y -= enemy.speed;
        }

        if (keys["ArrowDown"]) {
            enemy.y += enemy.speed;
        }
    }

    enemy.y = clamp(
        enemy.y,
        arenaTop(),
        arenaBottom() - enemy.height
    );
}

function updateBall() {
    trail.push({
        x: ball.x,
        y: ball.y
    });

    if (trail.length > 14) {
        trail.shift();
    }

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y - ball.radius <= arenaTop()) {
        ball.y = arenaTop() + ball.radius;
        ball.vy = Math.abs(ball.vy);

        spawnParticles(
            ball.x,
            ball.y,
            BORDER_COLOR,
            10
        );
    }

    if (ball.y + ball.radius >= arenaBottom()) {
        ball.y = arenaBottom() - ball.radius;
        ball.vy = -Math.abs(ball.vy);

        spawnParticles(
            ball.x,
            ball.y,
            BORDER_COLOR,
            10
        );
    }

    if (
        ball.vx < 0 &&
        paddleCollision(player)
    ) {
        const relative =
            (ball.y - (player.y + player.height / 2)) /
            (player.height / 2);

        const angle = relative * 1.15;

        ball.speed = Math.min(
            ball.speed * 1.045,
            21
        );

        ball.vx = Math.cos(angle) * ball.speed;
        ball.vy = Math.sin(angle) * ball.speed;

        ball.x =
            player.x +
            player.width +
            ball.radius;

        rally++;

        spawnParticles(
            ball.x,
            ball.y,
            PLAYER_COLOR,
            24
        );

        screenShake = 5;
    }

    if (
        ball.vx > 0 &&
        paddleCollision(enemy)
    ) {
        const relative =
            (ball.y - (enemy.y + enemy.height / 2)) /
            (enemy.height / 2);

        const angle = relative * 1.15;

        ball.speed = Math.min(
            ball.speed * 1.045,
            21
        );

        ball.vx = -Math.cos(angle) * ball.speed;
        ball.vy = Math.sin(angle) * ball.speed;

        ball.x = enemy.x - ball.radius;

        rally++;

        spawnParticles(
            ball.x,
            ball.y,
            ENEMY_COLOR,
            24
        );

        screenShake = 5;
    }

    if (ball.x < -60) {
        enemyScore++;
        updateScore();

        spawnParticles(
            width / 2,
            height / 2,
            ENEMY_COLOR,
            55
        );

        screenShake = 10;
        rally = 0;

        if (enemyScore >= WIN_SCORE) {
            endGame(false);
        } else {
            resetBall(-1);
        }
    }

    if (ball.x > width + 60) {
        playerScore++;
        updateScore();

        spawnParticles(
            width / 2,
            height / 2,
            PLAYER_COLOR,
            55
        );

        screenShake = 10;
        rally = 0;

        if (playerScore >= WIN_SCORE) {
            endGame(true);
        } else {
            resetBall(1);
        }
    }
}

function update() {
    updateParticles();

    if (!gameRunning || paused || countdownRunning) {
        return;
    }

    updatePlayer();
    updateEnemy();
    updateBall();

    if (screenShake > 0.1) {
        screenShake *= 0.88;
    }

    updateHUD();
}

function draw(time) {
    ctx.save();

    if (screenShake > 0.2) {
        ctx.translate(
            random(-screenShake, screenShake),
            random(-screenShake, screenShake)
        );
    }

    drawBackground(time);
    drawPaddle(player, PLAYER_COLOR);
    drawPaddle(enemy, ENEMY_COLOR);
    drawBall();
    drawParticles();

    ctx.restore();
}

function updateScore() {
    document.getElementById("playerScore").textContent = playerScore;
    document.getElementById("enemyScore").textContent = enemyScore;
}

function updateHUD() {
    document.getElementById("rallyNumber").textContent = rally;
}

function countdown(callback) {
    countdownRunning = true;

    const container = document.getElementById("countdown");
    const text = document.getElementById("countdownText");

    container.classList.add("active");

    let number = 3;

    function next() {
        if (number === 0) {
            text.textContent = "GO";

            setTimeout(function() {
                container.classList.remove("active");
                countdownRunning = false;
                callback();
            }, 500);

            return;
        }

        text.textContent = number;
        number--;

        setTimeout(next, 700);
    }

    next();
}

function startGame(mode) {
    gameMode = mode;

    playerScore = 0;
    enemyScore = 0;
    rally = 0;

    particles = [];
    trail = [];

    positionObjects();
    updateScore();
    updateHUD();

    resetBall(Math.random() > 0.5 ? 1 : -1);

    gameRunning = true;
    paused = false;

    document.body.classList.toggle(
        "ai-mode",
        mode === "ai"
    );

    document.getElementById("menu").classList.add("hidden");
    document.getElementById("hud").classList.add("active");

    document.getElementById("pauseScreen").classList.add("hidden");
    document.getElementById("gameOver").classList.add("hidden");

    document.getElementById("enemyLabel").textContent =
        mode === "ai" ? "AI" : "PLAYER 2";

    countdown(function() {
        resetBall(Math.random() > 0.5 ? 1 : -1);
    });
}

function togglePause() {
    if (!gameRunning) {
        return;
    }

    paused = !paused;

    document.getElementById("pauseScreen").classList.toggle(
        "hidden",
        !paused
    );
}

function endGame(playerWon) {
    gameRunning = false;

    document.body.classList.remove("ai-mode");

    const title = document.getElementById("gameOverTitle");
    const subtitle = document.getElementById("gameOverSubtitle");

    if (playerWon) {
        title.textContent = "VICTORY";
        subtitle.textContent = "PLAYER 1 WINS 7 POINTS";
    } else if (gameMode === "ai") {
        title.textContent = "DEFEAT";
        subtitle.textContent = "THE AI WINS 7 POINTS";
    } else {
        title.textContent = "PLAYER 2 WINS";
        subtitle.textContent = "PLAYER 2 TAKES THE ARENA";
    }

    document.getElementById("gameOver").classList.remove("hidden");
}

function returnToMenu() {
    gameRunning = false;
    paused = false;
    countdownRunning = false;

    document.body.classList.remove("ai-mode");

    particles = [];
    trail = [];

    document.getElementById("pauseScreen").classList.add("hidden");
    document.getElementById("gameOver").classList.add("hidden");
    document.getElementById("hud").classList.remove("active");
    document.getElementById("menu").classList.remove("hidden");

    positionObjects();
}

document.getElementById("aiButton").addEventListener("click", function() {
    startGame("ai");
});

document.getElementById("twoPlayerButton").addEventListener("click", function() {
    startGame("two");
});

document.getElementById("resumeButton").addEventListener("click", function() {
    togglePause();
});

document.getElementById("quitButton").addEventListener("click", function() {
    returnToMenu();
});

document.getElementById("rematchButton").addEventListener("click", function() {
    startGame(gameMode);
});

document.getElementById("menuButton").addEventListener("click", function() {
    returnToMenu();
});

function gameLoop(time) {
    update();
    draw(time);
    requestAnimationFrame(gameLoop);
}

resize();
positionObjects();
updateScore();
updateHUD();

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
